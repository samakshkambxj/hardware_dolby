<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolby Atmos — Compose UI mockup</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #1a1e18 0%, #0d0f0c 60%);
    color: #e8ebe2;
    min-height: 100vh;
    padding: 36px 24px 64px;
  }
  header { text-align: center; margin-bottom: 34px; }
  header h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.2px; }
  header p { margin: 0; font-size: 13px; color: #98a08e; }

  .stage { display: flex; gap: 56px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }

  .phone { margin: 0; }
  .frame {
    width: 388px; height: 828px; padding: 12px;
    border-radius: 46px;
    background: linear-gradient(160deg, #2a2e26, #14170f);
    box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .screen {
    position: relative; width: 364px; height: 804px;
    border-radius: 36px; overflow: hidden;
    background: var(--bg); color: var(--on-surface);
    transition: background .25s, color .25s;
  }
  .phone figcaption { text-align: center; font-size: 12px; color: #98a08e; margin-top: 14px; letter-spacing: .3px; }

  /* ---------------- theme tokens ---------------- */
  .light {
    --bg: #F8F9FF;
    --surface: #FFFFFF;
    --surface-container-low: #F3F5FC;
    --surface-container: #ECEEF5;
    --surface-container-high: #E1E4ED;
    --surface-container-highest: #D8DCE7;
    --on-surface: #191C20;
    --on-surface-variant: #44474F;
    --outline: #74777F;
    --outline-variant: #C4C7D0;
    --primary: #2F5DBB;
    --on-primary: #FFFFFF;
    --primary-container: #D9E2FF;
    --on-primary-container: #001A41;
    --pill: #FFFFFF;
    --switch-off: #B8BCC7;
    --thumb: #FFFFFF;
    --error: #BA1A1A;
    --icon-bg: #FFFFFF;
    --nav-border: rgba(25, 28, 32, .10);
    --nav-shadow: 0 14px 32px rgba(24, 35, 66, .18), 0 2px 6px rgba(24, 35, 66, .08);
    --card-shadow: 0 1px 2px rgba(25, 28, 32, .05);
    --chart: #2F5DBB;
  }
  .dark {
    --bg: #111318;
    --surface: #191C20;
    --surface-container-low: #191C20;
    --surface-container: #1D2024;
    --surface-container-high: #282A2F;
    --surface-container-highest: #33363B;
    --on-surface: #E3E2E9;
    --on-surface-variant: #C3C6CF;
    --outline: #8E9099;
    --outline-variant: #42464F;
    --primary: #ADC6FF;
    --on-primary: #002E69;
    --primary-container: #17417F;
    --on-primary-container: #D9E2FF;
    --pill: #282A2F;
    --switch-off: #464A54;
    --thumb: #E3E2E9;
    --error: #FFB4AB;
    --icon-bg: #191C20;
    --nav-border: rgba(255, 255, 255, .08);
    --nav-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --chart: #ADC6FF;
  }

  /* ---------------- status bar ---------------- */
  .statusbar {
    position: absolute; inset: 0 0 auto 0; height: 38px; z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; font-size: 12.5px; font-weight: 650; letter-spacing: .2px;
    pointer-events: none;
  }
  .statusbar svg { display: block; }

  /* ---------------- pages ---------------- */
  .page {
    position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
    padding: 42px 20px 110px;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.active { opacity: 1; pointer-events: auto; }

  /* ---------------- app bar ---------------- */
  .appbar {
    display: flex; align-items: center; gap: 0;
    padding: 6px 0 2px;
    position: relative;
  }
  .appbar h1 {
    flex: 1; margin: 0; font-size: 28px; font-weight: 500;
    letter-spacing: -.5px; color: var(--on-surface);
  }
  .appbar.eq h1 { font-size: 21px; letter-spacing: -.2px; }
  .appbar-menu {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--on-surface-variant);
  }
  .appbar-menu:hover { background: var(--surface-container-high); }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: 42px; z-index: 20; min-width: 190px;
    display: none; flex-direction: column; padding: 6px 0;
    border-radius: 14px; background: var(--surface-container-high);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .menu.open { display: flex; }
  .menu button {
    border: 0; background: transparent; color: var(--on-surface);
    font: inherit; font-size: 13px; text-align: left;
    padding: 11px 16px; cursor: pointer;
  }
  .menu button:hover { background: var(--surface-container-highest); }
  .menu button:disabled { color: var(--on-surface-variant); opacity: .5; cursor: default; }

  /* ---------------- hero: AOSP master switch ---------------- */
  .hero {
    position: relative; border-radius: 28px;
    padding: 18px; margin-top: 6px;
    background: var(--surface-container);
    color: var(--on-surface);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hero-top { display: flex; align-items: center; gap: 14px; }
  .hero-logo {
    flex: none; width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--primary-container); color: var(--on-primary-container);
  }
  .hero-logo svg { width: 26px; height: 20px; }
  .hero-copy { flex: 1; min-width: 0; }
  .hero-copy h2 {
    margin: 0 0 3px; font-size: 16.5px; line-height: 1.2;
    letter-spacing: -.015em; font-weight: 600; color: inherit;
  }
  .hero-copy p { margin: 0; font-size: 12.5px; color: var(--on-surface-variant); }

  /* Material 3 switch */
  .sw {
    position: relative; flex: none; width: 52px; height: 32px; border: 0; border-radius: 16px;
    background: var(--switch-off); cursor: pointer; padding: 0;
    transition: background .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sw .knob {
    position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--outline); color: transparent;
    display: grid; place-items: center;
    transition: top .25s cubic-bezier(.34,1.4,.64,1), left .25s cubic-bezier(.34,1.4,.64,1),
                width .25s cubic-bezier(.34,1.4,.64,1), height .25s cubic-bezier(.34,1.4,.64,1),
                transform .25s cubic-bezier(.34,1.4,.64,1), background .25s, color .25s;
  }
  .sw .knob svg { width: 15px; height: 15px; }
  .sw.on { background: var(--primary); }
  .sw.on .knob {
    top: 4px; left: 4px; width: 24px; height: 24px;
    transform: translateX(20px);
    background: var(--on-primary); color: var(--primary);
  }
  .sw.off-disabled { opacity: .38; pointer-events: none; }

  .hero-chips { display: flex; gap: 8px; margin-top: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    background: var(--pill); color: var(--on-surface);
    white-space: nowrap; min-width: 0;
  }
  .chip.accent { background: var(--primary-container); color: var(--on-primary-container); }
  .chip svg { flex: none; }
  .chip .label { overflow: hidden; text-overflow: ellipsis; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; }
  .chip .dot.off { background: var(--outline); }

  .dimmable { transition: opacity .25s ease; }
  .dimmable.off { opacity: .38; pointer-events: none; }

  /* ---------------- generic card + labels ---------------- */
  .card { background: var(--surface-container); border-radius: 28px; }
  .section-label {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 24px 4px 10px; font-size: 13.5px; font-weight: 600; letter-spacing: .1px;
  }
  .section-label .meta {
    font-size: 11px; font-weight: 500; color: var(--on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------------- carousel ---------------- */
  .carousel { padding: 12px; margin-top: 18px; }
  .carousel-title { text-align: center; font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .pager {
    position: relative; height: 140px; perspective: 900px; overflow: hidden;
  }
  .pcard {
    position: absolute; left: 50%; top: 0; width: 172px; height: 140px; margin-left: -86px;
    border: 0; padding: 0; border-radius: 32px; overflow: hidden; cursor: pointer;
    background: var(--surface-container-high);
    color: var(--on-surface-variant); font: inherit; text-align: center;
    transform-origin: 50% 50%;
    transition: transform .34s cubic-bezier(.22,.85,.25,1), opacity .34s ease,
                background .25s ease, color .25s ease, box-shadow .34s;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
  .pcard.sel {
    background: var(--primary-container); color: var(--on-primary-container);
    box-shadow: 0 3px 8px rgba(0,0,0,.18);
  }
  .pcard .p-body {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pcard .p-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-container-highest);
    color: var(--on-surface-variant);
    transition: transform .3s cubic-bezier(.34,1.5,.64,1), background .25s, color .25s;
  }
  .pcard.sel .p-icon { background: var(--primary); color: var(--on-primary); }
  .pcard .p-icon svg { width: 28px; height: 28px; }
  .pcard.sel .p-icon { animation: floaty 1.6s ease-in-out infinite alternate; }
  @keyframes floaty {
    from { transform: translateY(0) rotate(-3deg); }
    to   { transform: translateY(-4px) rotate(3deg); }
  }
  .pcard .p-name { margin-top: 10px; font-size: 14px; font-weight: 600; letter-spacing: -.1px; }
  .pcard .p-underline {
    margin-top: 6px; width: 24px; height: 2px; border-radius: 2px; background: var(--primary);
    opacity: 0; transform: scaleX(.4); transition: opacity .25s, transform .25s;
  }
  .pcard.sel .p-underline { opacity: 1; transform: scaleX(1); }
  .pcard .p-check {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary); color: var(--on-primary); display: grid; place-items: center;
    opacity: 0; transform: scale(.5); transition: opacity .25s, transform .28s cubic-bezier(.34,1.5,.64,1);
  }
  .pcard .p-check svg { width: 15px; height: 15px; }
  .pcard.sel .p-check { opacity: 1; transform: scale(1); }

  .dots { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; height: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 999px; background: var(--outline-variant); transition: width .28s cubic-bezier(.22,.85,.25,1), background .28s; cursor: pointer; }
  .dots i.on { width: 24px; background: var(--primary); }

  /* ---------------- grouped rows (2px gaps) ---------------- */
  .group { display: flex; flex-direction: column; gap: 2px; border-radius: 28px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 13px; width: 100%; min-height: 60px;
    padding: 10px 15px; border: 0; font: inherit; color: inherit; text-align: left;
    background: var(--surface-container); cursor: pointer;
  }
  button.row:active, .row:active { background: var(--surface-container-high); }
  .row.disabled { opacity: .38; pointer-events: none; }
  .row-icon {
    flex: none; width: 38px; height: 38px; border-radius: 13px;
    display: grid; place-items: center; background: var(--icon-bg); color: var(--on-surface-variant);
  }
  .row-icon svg { width: 20px; height: 20px; }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-text b {
    font-size: 14.5px; font-weight: 500; letter-spacing: -.004em; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-text small {
    font-size: 11.5px; color: var(--on-surface-variant); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .value-pill {
    flex: none; padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    background: var(--pill); color: var(--on-surface); box-shadow: 0 1px 2px rgba(0,0,0,.14);
    white-space: nowrap;
  }
  .chev { flex: none; color: var(--on-surface-variant); display: grid; place-items: center; }
  .chev svg { width: 19px; height: 19px; }
  .spark { flex: none; width: 58px; height: 24px; color: var(--primary); }

  /* intelligent equalizer block */
  .ieq { display: block; padding: 12px 15px 14px; background: var(--surface-container); }
  .ieq-head { display: flex; align-items: center; gap: 13px; }
  .ieq-options { display: flex; gap: 7px; margin-top: 12px; }
  .ieq-opt {
    flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 16px;
    padding: 8px 0 7px; cursor: pointer; font: inherit; text-align: center;
    background: var(--surface); color: var(--on-surface-variant);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .ieq-opt svg { width: 22px; height: 22px; }
  .ieq-opt span { font-size: 9.5px; font-weight: 500; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ieq-opt.sel {
    background: var(--primary-container); color: var(--on-primary-container);
    border-color: color-mix(in srgb, var(--primary) 34%, transparent);
  }
  .ieq-opt.sel svg { color: var(--primary); }

  /* reset button */
  .reset-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 48px; margin-top: 8px; border: 0; border-radius: 999px;
    background: transparent; color: var(--error); font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .reset-btn svg { width: 19px; height: 19px; }
  .reset-btn:hover { background: color-mix(in srgb, var(--error) 8%, transparent); }

  /* ---------------- equalizer page ---------------- */
  .presets {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 12px 0 2px; margin: 0 -20px; padding-left: 20px; padding-right: 20px;
  }
  .presets::-webkit-scrollbar { display: none; }
  .preset {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 0;
    font: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
    background: var(--surface-container); color: var(--on-surface-variant);
    transition: background .2s, color .2s;
  }
  .preset.active { background: var(--primary); color: var(--on-primary); }
  .preset.new {
    display: inline-flex; align-items: center; gap: 5px;
    background: transparent; color: var(--on-surface-variant);
    border: 1px solid var(--outline-variant);
  }
  .preset.new svg { width: 15px; height: 15px; }

  .eq-card { margin-top: 16px; padding: 16px; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-head span:first-child { flex: 1; font-size: 13.5px; font-weight: 600; }
  .meta-pill {
    flex: none; padding: 5px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    background: var(--surface); color: var(--on-surface-variant);
    box-shadow: 0 1px 2px rgba(0,0,0,.14); max-width: 60%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chart-wrap { display: flex; gap: 6px; margin-top: 6px; }
  .y-axis {
    flex: none; width: 24px; height: 132px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
  }
  .y-axis span, .x-axis span { font-size: 8px; color: var(--on-surface-variant); line-height: 1; }
  .curve { flex: 1; height: 132px; overflow: visible; }
  .x-axis { display: flex; justify-content: space-between; margin: 4px 0 0 30px; }

  .bands { display: flex; gap: 4px; justify-content: space-between; margin-top: 12px; }
  .band { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .band-val { font-size: 9px; font-weight: 600; color: var(--on-surface-variant); height: 11px; }
  .band-track {
    position: relative; width: 100%; max-width: 18px; height: 120px; border-radius: 999px;
    background: var(--surface-container-high); cursor: ns-resize; touch-action: none; overflow: hidden;
  }
  .band-track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: var(--outline-variant); opacity: .55;
  }
  .band-fill { position: absolute; left: 0; right: 0; background: var(--primary); border-radius: 999px; }
  .band-thumb {
    position: absolute; left: 50%; width: 16px; height: 7px; margin-bottom: -3px;
    border-radius: 999px; background: var(--thumb); box-shadow: 0 1px 3px rgba(0,0,0,.35);
    transform: translateX(-50%);
  }
  .band-freq { font-size: 8.5px; color: var(--on-surface-variant); opacity: .85; }

  .btn-filled {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 50px; margin-top: 16px; border: 0; border-radius: 999px;
    background: var(--primary); color: var(--on-primary);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-filled svg { width: 18px; height: 18px; }
  .hint {
    margin: 8px 4px 0; text-align: center; font-size: 10.5px;
    color: var(--on-surface-variant); line-height: 1.45;
  }

  /* ---------------- single-choice dialog ---------------- */
  .scrim {
    position: absolute; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0,0,0,.42);
  }
  .scrim.open { display: flex; }
  .dialog {
    width: 100%; max-width: 300px;
    background: var(--surface-container-high); color: var(--on-surface);
    border-radius: 28px; padding: 24px 20px 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    animation: dialogIn .18s cubic-bezier(.2,0,0,1);
  }
  @keyframes dialogIn {
    from { transform: scale(.94); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .dialog-title { margin: 0 0 12px; font-size: 20px; font-weight: 500; letter-spacing: -.2px; }
  .dialog-options { display: flex; flex-direction: column; gap: 2px; }
  .dialog-option {
    display: flex; align-items: center; gap: 12px;
    border: 0; border-radius: 12px; background: transparent; color: inherit;
    font: inherit; font-size: 15px; text-align: left; padding: 10px 8px; cursor: pointer;
  }
  .dialog-option:hover { background: var(--surface-container-highest); }
  .radio {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--on-surface-variant);
    display: grid; place-items: center;
    transition: border-color .2s;
  }
  .radio i { width: 10px; height: 10px; border-radius: 50%; background: transparent; transition: background .2s; }
  .dialog-option.sel .radio { border-color: var(--primary); }
  .dialog-option.sel .radio i { background: var(--primary); }
  .dialog-actions { display: flex; justify-content: flex-end; padding-top: 8px; }
  .dialog-cancel {
    border: 0; background: transparent; color: var(--primary);
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 12px;
    border-radius: 999px; cursor: pointer;
  }
  .dialog-cancel:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }

  /* ---------------- floating navbar ---------------- */
  .nav {
    position: absolute; left: 0; right: 0; bottom: 16px; margin: 0 auto; z-index: 10;
    width: min(300px, calc(100% - 32px)); height: 66px;
    display: flex; align-items: center; gap: 6px; padding: 6px;
    border-radius: 33px;
    background: var(--surface-container);
    border: 1px solid var(--nav-border);
    box-shadow: var(--nav-shadow);
  }
  .nav-item {
    flex: 1; height: 100%; border: 0; padding: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--on-surface-variant); font: inherit; cursor: pointer;
    transition: background .25s ease, color .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item.active { background: var(--primary-container); color: var(--on-primary-container); }
  .nav-icon { display: grid; place-items: center; transition: transform .3s cubic-bezier(.34,1.5,.64,1); }
  .nav-item:not(.active) .nav-icon { transform: scale(.9); }
  .nav-icon svg { display: block; }
  .nav-icon .filled { display: none; }
  .nav-item.active .nav-icon .outline { display: none; }
  .nav-item.active .nav-icon .filled { display: block; }

  .nav-item.active .icon-home { animation: navbob 1.6s ease-in-out infinite alternate, navtilt 2.1s linear infinite alternate; }
  @keyframes navbob { from { transform: translateY(0) scale(1); } to { transform: translateY(-2.5px) scale(1); } }
  @keyframes navtilt { from { rotate: -4deg; } to { rotate: 4deg; } }

  .nav-label {
    max-width: 0; margin-left: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    font-size: 12.5px; font-weight: 600; letter-spacing: -.1px;
    transition: max-width .3s cubic-bezier(.22,.85,.25,1), margin-left .3s cubic-bezier(.22,.85,.25,1), opacity .18s ease;
  }
  .nav-item.active .nav-label { max-width: 110px; margin-left: 7px; opacity: 1; }

  .eq-bars { display: flex; align-items: flex-end; justify-content: center; gap: 2px; width: 21px; height: 19px; }
  .eq-bars i {
    width: 3px; border-radius: 2px; background: currentColor;
    animation: eqbar 900ms ease-in-out infinite alternate;
  }

function chartPath(vals) {
  const w = 300, pad = 0, step = (w - pad * 2) / (vals.length - 1);

  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], mx = (x1 + x2) / 2;

  return { d, pts };

  };

  const navItems = [...screen.querySelectorAll('.nav-item')];
  const pages = [...screen.querySelectorAll('.page')];

  function setTab(tab) {
    navItems.forEach(b => b.classList.toggle('active', b.dataset.goto === tab));
    pages.forEach(p => p.classList.toggle('active', p.dataset.page === tab));
  }

  navItems.forEach(b => b.addEventListener('click', () => setTab(b.dataset.goto)));
  screen.querySelectorAll('[data-goto-eq]').forEach(b => b.addEventListener('click', () => setTab('eq')));

  /* ---------- overflow menu ---------- */
  const menuBtn = screen.querySelector('[data-menu]');
  const menu = screen.querySelector('.menu');
  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  screen.addEventListener('click', () => menu.classList.remove('open'));

  /* ---------- carousel ---------- */
  const pager = screen.querySelector('.pager');
  const dots = screen.querySelector('.dots');

  const cards = PROFILES.map((p, i) => {
    const c = node(`<button class="pcard" type="button">
        <span class="p-body">
          <span class="p-icon">${ICON[p.icon]}</span>
          <span class="p-name">${p.name}</span>
          <span class="p-underline"></span>
        </span>
        <span class="p-check">${CHECK}</span>
      </button>`);
    c.addEventListener('click', () => { state.profile = i; layoutCarousel(); });
    pager.appendChild(c);
    return c;
  });

  const dotEls = PROFILES.map((p, i) => {
    const d = node('<i></i>');
    d.addEventListener('click', () => { state.profile = i; layoutCarousel(); });
    dots.appendChild(d);
    return d;
  });

  function layoutCarousel() {
    cards.forEach((c, i) => {
      const o = i - state.profile;
      const abs = Math.abs(o);
      c.classList.toggle('sel', o === 0);
      c.style.transform =
        `translateX(${o * 180}px) rotateY(${-o * 14}deg) scale(${1 - 0.2 * Math.min(abs, 1)})`;
      c.style.opacity = String(o === 0 ? 1 : Math.max(0, 0.5 - 0.22 * (abs - 1)));
      c.style.zIndex = String(10 - Math.min(abs, 3));
      c.style.pointerEvents = abs > 2 ? 'none' : 'auto';
    });
    dotEls.forEach((d, i) => d.classList.toggle('on', i === state.profile));
    const name = PROFILES[state.profile].name;
    screen.querySelectorAll('.js-profile').forEach(n => { n.textContent = name; });
  }

  /* ---------- intelligent equalizer ---------- */
  const ieqBox = screen.querySelector('.ieq-options');
  const ieqEls = IEQ.map((opt, i) => {
    const b = node(`<button class="ieq-opt" type="button">${ICON[opt.icon]}<span>${opt.name}</span></button>`);
    b.addEventListener('click', () => { state.ieq = i; renderIeq(); });
    ieqBox.appendChild(b);
    return b;
  });

  function renderIeq() {
    ieqEls.forEach((b, i) => b.classList.toggle('sel', i === state.ieq));
    screen.querySelector('.js-ieq').textContent = IEQ[state.ieq].name;
  }

  /* ---------- single-choice dialogs ---------- */
  const scrim = screen.querySelector('.scrim');
  const dialogTitle = screen.querySelector('.dialog-title');
  const dialogOptions = screen.querySelector('.dialog-options');

  function closeChoice() {
    scrim.classList.remove('open');
  }

  function openChoice(title, options, selected, onPick) {
    dialogTitle.textContent = title;
    dialogOptions.innerHTML = '';
    options.forEach((label, index) => {
      const picked = index === selected;
      const b = node(`<button class="dialog-option${picked ? ' sel' : ''}" type="button" role="radio" aria-checked="${picked}">
          <span class="radio"><i></i></span>
          <span>${label}</span>
        </button>`);
      b.addEventListener('click', () => {
        onPick(index);
        closeChoice();
      });
      dialogOptions.appendChild(b);
    });
    scrim.classList.add('open');
  }

  screen.querySelector('.dialog-cancel').addEventListener('click', closeChoice);
  scrim.addEventListener('click', e => {
    if (e.target === scrim) closeChoice();
  });

  screen.querySelector('[data-choice="dialogue"]').addEventListener('click', () => {
    openChoice('Dialogue enhancer', DIALOGUE, state.dialogue, index => {
      state.dialogue = index;
      screen.querySelector('.js-dialogue').textContent = DIALOGUE[index];
    });
  });

  screen.querySelector('[data-choice="stereo"]').addEventListener('click', () => {
    openChoice('Stereo widening', STEREO, state.stereo, index => {
      state.stereo = index;
      screen.querySelector('.js-stereo').textContent = STEREO[index];
    });
  });

  /* ---------- bands + curve ---------- */
  const bandsBox = screen.querySelector('.bands');
  const curveLine = screen.querySelector('.curve-line');
  const curveFill = screen.querySelector('.curve-fill');
  const curveDots = screen.querySelector('.curve-dots');
  const spark = screen.querySelector('.js-spark');
  const presetSub = screen.querySelector('.js-preset-sub');
  const presetName = screen.querySelector('.js-preset-name');

  const bandEls = state.bands.map((_, i) => {
    const b = node(`<div class="band">
        <span class="band-val">0</span>
        <div class="band-track"><div class="band-fill"></div><div class="band-thumb"></div></div>
        <span class="band-freq">${FREQS[i]}</span>
      </div>`);
    const track = b.querySelector('.band-track');
    let dragging = false;

    const apply = (e) => {
      const r = track.getBoundingClientRect();
      const ratio = 1 - (e.clientY - r.top) / r.height;
      const v = Math.max(-10, Math.min(10, Math.round(ratio * 20 - 10)));
      state.bands[i] = v;
      state.preset = null;
      renderBands();
      renderChart();
      renderSpark();
      renderPresets();
      renderPresetLabels();
    };

    track.addEventListener('pointerdown', e => {
      dragging = true;
      track.setPointerCapture(e.pointerId);
      apply(e);
    });
    track.addEventListener('pointermove', e => { if (dragging) apply(e); });
    track.addEventListener('pointerup', () => { dragging = false; });
    track.addEventListener('pointercancel', () => { dragging = false; });

    bandsBox.appendChild(b);
    return b;
  });

  function renderBands() {
    bandEls.forEach((b, i) => {
      const v = state.bands[i];
      b.querySelector('.band-val').textContent = v > 0 ? '+' + v : String(v);
      const fill = b.querySelector('.band-fill');
      const thumb = b.querySelector('.band-thumb');
      if (v >= 0) {
        fill.style.top = (50 - v * 5) + '%';
        fill.style.height = (v * 5) + '%';
      } else {
        fill.style.top = '50%';
        fill.style.height = (-v * 5) + '%';
      }
      thumb.style.bottom = (50 + v * 5) + '%';
    });
  }

  function renderChart() {
    const { d, pts } = chartPath(state.bands);
    curveLine.setAttribute('d', d);
    curveFill.setAttribute('d', d + ' L 300 132 L 0 132 Z');
    curveDots.innerHTML = pts.map(([x, y]) =>
      `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="var(--surface-container)" stroke="var(--chart)" stroke-width="2"/>`
    ).join('');
  }

  function renderSpark() {
    const vals = state.bands;
    const step = 58 / (vals.length - 1);
    const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(12 - v * 0.95).toFixed(1)}`);
    spark.innerHTML = `<polyline points="${pts.join(' ')}"/>`;
  }

  function renderPresetLabels() {
    const label = state.preset || 'Custom';
    presetName.textContent = label;
    presetSub.textContent = label + ' · 10 bands';
  }

  /* ---------- presets ---------- */
  const presetBox = screen.querySelector('.presets');
  const presetNames = Object.keys(PRESETS);
  const presetEls = presetNames.map(name => {
    const b = node(`<button class="preset" type="button">${name}</button>`);
    b.addEventListener('click', () => {
      state.preset = name;
      state.bands = PRESETS[name].slice();
      renderBands();
      renderChart();
      renderSpark();
      renderPresets();
      renderPresetLabels();
    });
    presetBox.appendChild(b);
    return b;
  });
  presetBox.appendChild(node('<button class="preset new" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New</button>'));

  function renderPresets() {
    presetEls.forEach((b, i) => b.classList.toggle('active', presetNames[i] === state.preset));
  }

  /* ---------- master switch ---------- */
  const hero = screen.querySelector('.hero');
  const heroSwitch = screen.querySelector('.hero .sw');
  const status = screen.querySelector('.js-status');
  const statusDot = screen.querySelector('.chip .dot');
  const dimmable = screen.querySelector('.dimmable');
  const menuReset = screen.querySelector('.menu [data-reset]');

  function renderEnabled() {
    heroSwitch.classList.toggle('on', state.enabled);
    heroSwitch.setAttribute('aria-checked', String(state.enabled));
    dimmable.classList.toggle('off', !state.enabled);
    status.textContent = state.enabled ? 'On' : 'Off';
    if (statusDot) statusDot.classList.toggle('off', !state.enabled);
    menuReset.disabled = !state.enabled;
  }

  hero.addEventListener('click', () => {
    state.enabled = !state.enabled;
    renderEnabled();
  });

  screen.querySelectorAll('.row .sw').forEach(sw => {
    sw.addEventListener('click', e => {
      e.stopPropagation();
      sw.classList.toggle('on');
      sw.setAttribute('aria-checked', sw.classList.contains('on') ? 'true' : 'false');
    });
  });

  /* ---------- device: speaker vs headphones ---------- */
  function renderDevice() {
    const label = state.speaker ? 'Phone speaker' : 'Headphones';
    screen.querySelectorAll('.js-device').forEach(n => { n.textContent = label; });
    const icon = screen.querySelector('.js-device-icon');
    icon.innerHTML = state.speaker
      ? '<path d="M9 2.5 L15 2.5 A3 3 0 0 1 18 5.5 L18 18.5 A3 3 0 0 1 15 21.5 L9 21.5 A3 3 0 0 1 6 18.5 L6 5.5 A3 3 0 0 1 9 2.5 Z M10 18.5 L14 18.5"/>'
      : '<path d="M4 14 L4 12 A8 8 0 0 1 20 12 L20 14 M3 13 L7 13 L7 20 L3 20 Z M17 13 L21 13 L21 20 L17 20 Z"/>';

    screen.querySelector('.js-hp-sub').textContent =
      state.speaker ? 'Connect headphones' : 'Spatial audio for headphones';
    screen.querySelector('.js-stereo-sub').textContent =
      state.speaker ? 'Connect headphones' : 'Widens the stereo field';
    screen.querySelector('.js-hp-row').classList.toggle('disabled', state.speaker);
    screen.querySelector('.js-stereo-row').classList.toggle('disabled', state.speaker);
  }

  /* double-click a device section header to swap device (demo only) */
  screen.querySelectorAll('.section-label .js-device').forEach(n => {
    n.style.cursor = 'pointer';
    n.addEventListener('click', () => { state.speaker = !state.speaker; renderDevice(); });
  });

  /* ---------- reset to defaults ---------- */
  function doReset() {
    state.bands = PRESETS['Flat (off)'].slice();
    state.preset = 'Flat (off)';
    state.ieq = 1;
    state.dialogue = 2;
    state.stereo = 1;
    renderBands();
    renderChart();
    renderSpark();
    renderPresets();
    renderPresetLabels();
    renderIeq();
    screen.querySelector('.js-dialogue').textContent = DIALOGUE[state.dialogue];
    screen.querySelector('.js-stereo').textContent = STEREO[state.stereo];
  }
  screen.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', doReset));

  /* ---------- boot ---------- */
  setTab(screen.dataset.tab || 'home');
  layoutCarousel();
  renderIeq();
  renderBands();
  renderChart();
  renderSpark();
  renderPresets();
  renderPresetLabels();
  renderEnabled();
  renderDevice();
}

document.querySelectorAll('.screen').forEach(initFrame);
</script>
</body>
</html>
